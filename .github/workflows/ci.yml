name: PHP / MySQL / RTL assets checks + ready-to-install ZIP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-and-browser:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: apple_ci
          MYSQL_USER: apple_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u apple_ci -pci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip, xml, dom, simplexml, xmlreader, xmlwriter
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax validation
        run: find public src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax validation
        run: |
          node --check scripts/build-assets.mjs
          node --check public/assets/js/app.js
          node --check public/assets/js/setup.js
          node --check public/assets/js/records.js
          node --check tests/modal_browser.mjs
          node --check public/assets/vendor/hcg/hcg-select.js
      - name: PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Build all local browser assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:assets
          test -s public/assets/vendor/tabler/tabler.rtl.min.css
          test -s public/assets/vendor/vazirmatn/Vazirmatn-Regular.woff2
          test -s storage/fonts/Vazirmatn-Regular.ttf
      - name: Install Chromium for real UI regression checks
        run: npx playwright install --with-deps chromium
      - name: Persian PDF and Excel output verification
        run: php tests/exports.php
      - name: End-to-end installation and authentication smoke
        run: bash tests/smoke.sh

  package-ready-site:
    name: Build downloadable site package
    needs: php-and-browser
    # Do not publish unreviewed pull request code as a deployment artifact.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fresh checkout: the smoke test in the other job deletes install.php.
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip, xml, dom, simplexml, xmlreader, xmlwriter
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare production PHP libraries
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Prepare all self-hosted frontend assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:assets
      - name: Test archive generation and secret exclusions
        run: python3 -m unittest discover -s tests -p 'test_package.py' -v
      - name: Assemble distributable and SHA-256 checksums
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(echo "$GITHUB_SHA" | cut -c1-12)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/package_release.py --output dist --version "$VERSION"
          (cd dist && sha256sum --check -- *.sha256)
          test -s "dist/apple-id-management-$VERSION.zip"
          test -s "dist/apple-id-management-$VERSION.zip.sha256"
      - name: Upload ready-to-install bundle
        uses: actions/upload-artifact@v4
        with:
          name: apple-id-management-ready-${{ steps.bundle.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
